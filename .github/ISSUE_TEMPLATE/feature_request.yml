name: Feature Request
description: Suggest a new feature or enhancement for DX-OS
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check our [ROADMAP.md](https://github.com/ROYCE-8425/open_source/blob/main/ROADMAP.md) to see if this is already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific marketing workflow problem or limitation?
      placeholder: Describe the problem you are trying to solve...
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the proposed architecture or user experience...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      description: Are you willing to help implement this feature?
      options:
        - label: I am willing to submit a pull request with implementation and tests.
